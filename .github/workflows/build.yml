name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The engine and its self checks build anywhere. No EPROM image is needed: the checks that want one
  # skip themselves.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build/cmake -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cmake --config Release
      - name: Test
        run: ctest --test-dir build/cmake -C Release --output-on-failure
      - name: Upload console
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FSVR-console-windows
          path: bin/fs1r_emu.exe
          if-no-files-found: error

  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The list JUCE itself asks for, in extern/JUCE/docs/Linux Dependencies.md, minus what the plugin
      # switches off: curl, the web browser and LADSPA hosting. Two of them are easy to miss.
      # juce_graphics asks pkg-config for "freetype2 fontconfig" in one go, so a missing fontconfig
      # takes freetype's include path down with it and juceaide fails on ft2build.h at configure time.
      # juce_gui_basics reaches for XInput2.h, which is libxi-dev's, not libx11-dev's.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev
      - name: Configure
        run: cmake -B build/plugin -S . -DFS1R_BUILD_PLUGIN=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/plugin --config Release
      # Zipped here rather than in the release job, because an Actions artifact does not carry the
      # executable bit: bin/ uploaded as loose files comes back 644, and a macOS bundle whose
      # Contents/MacOS file is not executable fails to launch with "The application FSVR can't be
      # opened". A zip records the mode, and the artifact is then that one file, so a download off a
      # plain Actions run is as usable as a release asset. -y keeps the .component's symlinks as
      # symlinks.
      - name: Zip
        if: runner.os != 'Windows'
        run: cd bin && zip -ry ../FSVR-plugin-${{ matrix.name }}.zip .
      - name: Zip
        if: runner.os == 'Windows'
        run: Compress-Archive -Path bin\* -DestinationPath FSVR-plugin-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FSVR-plugin-${{ matrix.name }}
          path: FSVR-plugin-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    needs: [engine, plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release body is the annotated tag's message (AGENTS.md, "Releases"). generate_release_notes
      # alone left v0.4.6 with nothing but a compare link, and actions/checkout peels a tag ref to its
      # commit, which handed v0.4.7 the commit message, so the tag object is read off the API instead.
      # A lightweight tag has no tag object and fails here on purpose.
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$sha" --jq .message > notes.md && test -s notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The plugin jobs upload a ready zip each, so only the console artifact is still loose files.
      - name: Zip the console
        run: |
          cd artifacts
          for d in */; do
            n=${d%/}
            if [ -f "$n/$n.zip" ]; then mv "$n/$n.zip" . && rmdir "$n"; else (cd "$n" && zip -r "../$n.zip" .); fi
          done
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body_path: notes.md
